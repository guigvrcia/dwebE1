<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Currículo de Harry Styles</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
    <main>
        <h2>Entre em contato comigo:</h2>

        <form action="#" method="post" novalidate>
            <div>
                <label for="nomePessoa">Nome:</label>
                <input type="text" id="nomePessoa" name="nomePessoa" required>
            </div>

            <div>
                <label for="emailPessoa">E-mail:</label>
                <input type="email" id="emailPessoa" name="emailPessoa" required>
            </div>

            <div>
                <label for="telefonePessoa">Telefone:</label>
                <input type="tel" id="telefonePessoa" name="telefonePessoa" placeholder="(34) 91234-5678">
            </div>

            <fieldset>
                <legend>Escreva seu recado:</legend>
                <div>
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem" name="mensagem" rows="4"></textarea>
                </div>

                <div>
                    <label for="recrutador">Você é recrutador?</label>
                    <select id="recrutador" name="recrutador">
                        <option value="sim">Sim</option>
                        <option value="nao">Não</option>
                    </select>
                </div>
            </fieldset>

            <div>
                <button type="submit">Enviar</button>
            </div>
        </form>
        <p><a href="index.html">Voltar para a página inicial</a></p>
    </main>
</body>
</html>
